    <style>
        :root {
            --accent: #FFD700;
            --accent2: #FFEA00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1150px;
            margin: 20px auto;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .header {
            background: #111;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 3px solid var(--accent);
        }

        .header-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--accent);
        }

        .header h1 {
            color: var(--accent);
            font-size: 2.2rem;
            margin-top: 10px;
        }

        .info {
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .info input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 16px;
        }

        .big-title {
            text-align: center;
            padding: 18px;
            font-size: 1.5rem;
            background: #222;
            color: var(--accent);
            border-left: 6px solid var(--accent);
            margin: 10px 0;
        }

        /* Room Card Styles */
        .room-card {
            margin: 20px 18px;
            border-radius: 22px;
            overflow: hidden;
            background: #1a1a1a;
            border: 2px solid #FFD70055;
        }

        .room-header {
            background: linear-gradient(135deg, #111, #1f1f1f);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-header h2 {
            color: #FFD700;
            font-size: 26px;
            font-weight: 600;
        }

        .delete-room-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            padding: 20px;
        }

        .room-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 14px;
            transition: 0.35s;
            animation: fadeUp 0.5s ease;
        }

        .room-field:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #FFD700;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.15);
        }

        .room-field label {
            display: block;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .room-field input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
        }

        .room-field input:focus {
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            transform: scale(1.03);
        }

        .add-room-btn {
            width: calc(100% - 36px);
            margin: 10px 18px 25px;
            padding: 20px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #FFD700, #FFEA00);
            color: #111;
            font-size: 26px;
            font-weight: 700;
            cursor: pointer;
        }

        #generateBillBtn {
            display: block;
            margin: 30px auto;
            padding: 16px 50px;
            font-size: 20px;
            font-weight: bold;
            background: var(--accent);
            color: #111;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--accent2);
            font-size: 15px;
        }

        /* Mobile Responsive */
        @media(max-width:1024px) {

            .room-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media(max-width:768px) {

            .container {
                margin: 0;
                border-radius: 0;
            }

            .room-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .room-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .room-field {
                padding: 12px;
            }

            .room-field label {
                font-size: 13px;
            }

            .room-field input {
                font-size: 16px;
                padding: 12px;
            }

            .add-room-btn {
                font-size: 20px;
                padding: 16px;
            }

            #generateBillBtn {
                width: 90%;
            }

        }

        @media(max-width:480px) {

            .room-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .room-field {
                border-radius: 14px;
                padding: 10px;
            }

            .room-field input {
                font-size: 15px;
                padding: 10px;
            }

            .room-header h2 {
                font-size: 20px;
            }

            .top-title {
                font-size: 18px;
            }

        }

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 999;
            background: #111;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid #FFD70055;
        }

        .back-btn {
            background: #FFD700;
            color: #111;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-btn:hover {
            transform: scale(1.05);
        }

        .top-title {
            color: #FFD700;
            font-size: 22px;
            font-weight: 600;
        }

        .room-card {
            animation: cardPop 0.45s ease;
            transition: 0.35s;
        }

        .room-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.12);
        }

        .add-room-btn,
        .delete-room-btn,
        .duplicate-room-btn,
        #generateBillBtn {
            transition: 0.3s;
        }

        .add-room-btn:hover,
        .delete-room-btn:hover,
        .duplicate-room-btn:hover,
        #generateBillBtn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.25);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardPop {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .room-field input::-webkit-outer-spin-button,
        .room-field input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* MODULE ALERT */
        .module-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff1e1e, #b30000);
            color: white;
            padding: 18px 22px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            z-index: 99999;
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.4);
            animation: slideIn 0.4s ease;
            max-width: 320px;
            border-left: 5px solid yellow;
        }

        .module-alert span {
            color: #FFD700;
            font-weight: bold;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>

</head>

                }
            }
            // ================= PDF DOWNLOAD =================

            // ================= PDF DOWNLOAD =================
            function downloadPDF() {

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'pt', 'a4');

                const customerName = document.getElementById('custName').value.trim() || "Customer";
                const address = document.getElementById('custAddress').value.trim() || "-";
                const phone = document.getElementById('phone').value.trim() || "-";

                // ================= HEADER =================
                pdf.setFillColor(0, 123, 255);
                pdf.rect(0, 0, 595, 70, "F");

                try {
                    const logo = document.querySelector(".header-logo");
                    if (logo) pdf.addImage(logo, "PNG", 40, 15, 55, 55);
                } catch (e) { }

                pdf.setTextColor(255, 255, 255);
                pdf.setFontSize(24);
                pdf.text("SM Technician", 120, 35);

                pdf.setFontSize(12);
                pdf.text("8935883863", 120, 55);

                const today = new Date();
                pdf.setTextColor(0);
                pdf.setFontSize(11);
                pdf.text(`Date: ${today.toLocaleDateString('en-IN')}`, 400, 40);

                // ================= CUSTOMER INFO =================
                pdf.setFontSize(12);
                pdf.text("Customer :", 40, 100);
                pdf.text(customerName, 140, 100);

                pdf.text("Address :", 40, 120);
                pdf.text(address, 140, 120);

                pdf.text("Mobile :", 40, 140);
                pdf.text(phone, 140, 140);

                pdf.line(40, 160, 555, 160);

                // ================= TABLE DATA =================
                const rows = [];
                let serial = 1;

                const tableRows = document.querySelectorAll('#billModal table tr');

                tableRows.forEach((row) => {
                    const cols = row.querySelectorAll('td');
                    if (cols.length < 2) return;

                    let material = cols[0].innerText.trim();

                    // Custom Extra Material Input Detect
                    const materialInput = cols[0].querySelector('input');

                    if (materialInput && materialInput.value.trim() !== '') {
                        material = materialInput.value.trim();
                    }

                    // Special handling for Wire Section
                    if (material.includes("mm wire")) {
                        const select = cols[1].querySelector('select');
                        const qtyInput = cols[1].querySelector('input');

                        const color = select ? select.value : '';
                        const qty = qtyInput ? qtyInput.value : '0';

                        if (parseInt(qty) > 0) {
                            rows.push([serial++, `${material} - ${color}`, qty, 'Pic']);
                        }
                    }
                    else {

                        let qty = '';
                        let unit = 'Pic';

                        const qtyInput = cols[1].querySelector('input');

                        if (qtyInput) {
                            qty = qtyInput.value;
                        } else {
                            qty = cols[1].innerText.trim();
                        }

                        // Unit Input Detect
                        const unitInput = cols[2].querySelector('input');

                        if (unitInput && unitInput.value.trim() !== '') {
                            unit = unitInput.value.trim();
                        } else {
                            unit = cols[2].innerText.trim();
                        }

                        if (
                            material &&
                            material !== "Extra Materials" &&
                            parseInt(qty) > 0
                        ) {
                            rows.push([serial++, material, qty, unit]);
                        }
                    }
                });

                // Generate Table
                pdf.autoTable({
                    startY: 180,
                    head: [['S.No.', 'Item Description', 'Quantity', 'Unit']],
                    body: rows,
                    theme: 'grid',
                    styles: { fontSize: 11, cellPadding: 6 },
                    headStyles: { fillColor: [0, 123, 255], textColor: 255, fontStyle: 'bold' },
                    alternateRowStyles: { fillColor: [245, 245, 245] },
                    columnStyles: {
                        0: { cellWidth: 45 },
                        1: { cellWidth: 320 },
                        2: { cellWidth: 60, halign: 'center' },
                        3: { cellWidth: 50, halign: 'center' }
                    }
                });

                // Footer
                const pageHeight = pdf.internal.pageSize.height;
                pdf.setFontSize(10);
                pdf.text("SM Technician • 8935883863", 40, pageHeight - 30);
                pdf.text("Thank you for choosing SM Technician!", 40, pageHeight - 15);

                // Save PDF with Customer Name
                const fileName = `${customerName.replace(/[^a-zA-Z0-9 ]/g, '_')}_Electrical_Estimate.pdf`;
                pdf.save(fileName);
            }

            // ================= BUTTON CONNECT =================

            document.getElementById('generateBillBtn').onclick = generateBill;

            renderRoomFields(
                document.querySelector(".room-card")
            );


            function renderRoomFields(roomCard) {

                // Room type ka naam lena
                const type =
                    roomCard.querySelector(".room-type").value;

                // Grid area lena
                const grid =
                    roomCard.querySelector(".dynamic-room-fields");

                // Template items lena
                const items =
                    ROOM_TEMPLATES[type];

                // Empty html
                let html = "";

                // Sab item banana
                items.forEach(item => {

                    html += `

        <div class="room-field">

            <label>${item}</label>

            <input
                type="number"
                value="0"
                data-item="${item}"
            >

        </div>

        `;
                });



                // HTML show karna
                grid.innerHTML = html;
            }


            function updateRoomTitle(selectEl) {

                const roomCard =
                    selectEl.closest(".room-card");

                renderRoomFields(roomCard);

                updateRoomNumbers();
            }


            document.addEventListener("focusin", function (e) {

                if (
                    e.target.tagName === "INPUT" &&
                    e.target.type === "number"
                ) {

                    if (e.target.value === "0") {
                        e.target.value = "";
                    }

                }

            });

            document.addEventListener("focusout", function (e) {

                if (
                    e.target.tagName === "INPUT" &&
                    e.target.type === "number"
                ) {

                    if (e.target.value.trim() === "") {
                        e.target.value = "0";
                    }

                }

            });

            function showModuleAlert(roomName, moduleCount) {

                const oldAlert = document.querySelector(".module-alert");

                if (oldAlert) {
                    oldAlert.remove();
                }

                const alertBox = document.createElement("div");

                alertBox.className = "module-alert";

                alertBox.innerHTML = `
        ⚠️ <span>${roomName}</span><br>
        Module Count: ${moduleCount}<br><br>
        18 se zyada module allowed nahi hai.
    `;

                document.body.appendChild(alertBox);

                setTimeout(() => {
                    alertBox.remove();
                }, 5000);
            }






            // ================= SHARE ON WHATSAPP =================
            function shareOnWhatsApp() {
                const customerName = document.getElementById('custName').value.trim() || "Customer";
                const phone = document.getElementById('phone').value.trim();

                if (!phone) {
                    alert("Please enter Customer Mobile Number!");
                    return;
                }

                // Clean Phone Number
                let cleanPhone = phone.replace(/[^0-9]/g, '');
                if (cleanPhone.length === 10) {
                    cleanPhone = '91' + cleanPhone;
                }

                const message = encodeURIComponent(
                    `Hello ${customerName},\n\n` +
                    `Please find attached your Electrical Material Estimate.\n\n` +
                    `SM Technician\n` +
                    `8935883863\n\n` +
                    `Thank you! 🙏`
                );

                // First Download PDF
                downloadPDF();

                // Then open WhatsApp with message
                setTimeout(() => {
                    const whatsappURL = `https://wa.me/${cleanPhone}?text=${message}`;
                    window.open(whatsappURL, '_blank');

                    alert("✅ PDF Downloaded!\n\nNow you can attach the downloaded PDF in WhatsApp.");
                }, 800);
            }


        </script>
