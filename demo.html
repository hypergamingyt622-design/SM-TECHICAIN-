    <style>
        :root {
            --accent: #FFD700;
            --accent2: #FFEA00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1150px;
            margin: 20px auto;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .header {
            background: #111;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 3px solid var(--accent);
        }

        .header-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--accent);
        }

        .header h1 {
            color: var(--accent);
            font-size: 2.2rem;
            margin-top: 10px;
        }

        .info {
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .info input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 16px;
        }

        .big-title {
            text-align: center;
            padding: 18px;
            font-size: 1.5rem;
            background: #222;
            color: var(--accent);
            border-left: 6px solid var(--accent);
            margin: 10px 0;
        }

        /* Room Card Styles */
        .room-card {
            margin: 20px 18px;
            border-radius: 22px;
            overflow: hidden;
            background: #1a1a1a;
            border: 2px solid #FFD70055;
        }

        .room-header {
            background: linear-gradient(135deg, #111, #1f1f1f);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-header h2 {
            color: #FFD700;
            font-size: 26px;
            font-weight: 600;
        }

        .delete-room-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            padding: 20px;
        }

        .room-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 14px;
            transition: 0.35s;
            animation: fadeUp 0.5s ease;
        }

        .room-field:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #FFD700;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.15);
        }

        .room-field label {
            display: block;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .room-field input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
        }

        .room-field input:focus {
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            transform: scale(1.03);
        }

        .add-room-btn {
            width: calc(100% - 36px);
            margin: 10px 18px 25px;
            padding: 20px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #FFD700, #FFEA00);
            color: #111;
            font-size: 26px;
            font-weight: 700;
            cursor: pointer;
        }

        #generateBillBtn {
            display: block;
            margin: 30px auto;
            padding: 16px 50px;
            font-size: 20px;
            font-weight: bold;
            background: var(--accent);
            color: #111;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--accent2);
            font-size: 15px;
        }

        /* Mobile Responsive */
        @media(max-width:1024px) {

            .room-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media(max-width:768px) {

            .container {
                margin: 0;
                border-radius: 0;
            }

            .room-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .room-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .room-field {
                padding: 12px;
            }

            .room-field label {
                font-size: 13px;
            }

            .room-field input {
                font-size: 16px;
                padding: 12px;
            }

            .add-room-btn {
                font-size: 20px;
                padding: 16px;
            }

            #generateBillBtn {
                width: 90%;
            }

        }

        @media(max-width:480px) {

            .room-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .room-field {
                border-radius: 14px;
                padding: 10px;
            }

            .room-field input {
                font-size: 15px;
                padding: 10px;
            }

            .room-header h2 {
                font-size: 20px;
            }

            .top-title {
                font-size: 18px;
            }

        }

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 999;
            background: #111;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid #FFD70055;
        }

        .back-btn {
            background: #FFD700;
            color: #111;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-btn:hover {
            transform: scale(1.05);
        }

        .top-title {
            color: #FFD700;
            font-size: 22px;
            font-weight: 600;
        }

        .room-card {
            animation: cardPop 0.45s ease;
            transition: 0.35s;
        }

        .room-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.12);
        }

        .add-room-btn,
        .delete-room-btn,
        .duplicate-room-btn,
        #generateBillBtn {
            transition: 0.3s;
        }

        .add-room-btn:hover,
        .delete-room-btn:hover,
        .duplicate-room-btn:hover,
        #generateBillBtn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.25);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardPop {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .room-field input::-webkit-outer-spin-button,
        .room-field input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* MODULE ALERT */
        .module-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff1e1e, #b30000);
            color: white;
            padding: 18px 22px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            z-index: 99999;
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.4);
            animation: slideIn 0.4s ease;

            border-left: 5px solid yellow;
        }

        .module-alert span {
            color: #FFD700;
            font-weight: bold;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>

</head>

            // ================= GENERATE BILL =================
            function generateBill() {

                // RESET ALL MATERIALS
                for (let key in MATERIALS) {
                    MATERIALS[key] = 0;
                }

                const rooms = document.querySelectorAll(".room-card");

                rooms.forEach(room => {
                    const roomType = room.querySelector(".room-type").value;
                    const inputs = room.querySelectorAll("input");

                    let roomModule = 0;
                    let hasAnyItem = false;

                    // Check if room has any items
                    inputs.forEach(input => {
                        if (parseInt(input.value) > 0) hasAnyItem = true;
                    });



                    // Process all items
                    inputs.forEach(input => {
                        const qty = parseInt(input.value) || 0;
                        const item = input.dataset.item;
                        if (!qty) return;





                        // ================= FUSE =================
                        if (item === "Fuse") {

                            MATERIALS["Fuse"] += qty;

                            roomModule += qty * 1;
                        }


                        // ================= INDICATOR =================
                        if (item === "Indicator") {

                            MATERIALS["Indicator"] += qty;

                            roomModule += qty * 1;
                        }

                        // ================= ITEM CALCULATIONS =================

                        if (item === "Led bulb" || item === "Night bulb") {
                            MATERIALS[item] += qty;
                            MATERIALS["angle holder"] += qty;
                            MATERIALS["3/3 Junction box"] += qty;
                            MATERIALS["Gujja"] += qty;
                            MATERIALS['1.5"kala patch'] += qty;
                            MATERIALS["6amp switch"] += qty;
                            roomModule += qty * 1;
                        }

                        if (item === "Tube light") {
                            MATERIALS["Tube light 20W"] += qty;
                            MATERIALS["celling rose"] += qty;
                            MATERIALS["3/3 Junction box"] += qty;
                            MATERIALS["Gujja"] += qty;
                            MATERIALS['1.5"kala patch'] += qty;
                            MATERIALS["6amp switch"] += qty;
                            roomModule += qty * 1;
                        }

                        if (item === "conceal light") {
                            MATERIALS["conceal light"] += qty;
                            MATERIALS["6amp switch"] += qty;
                            roomModule += qty * 1;
                        }

                        if (item === "Fan") {
                            MATERIALS["Fan"] += qty;
                            MATERIALS["celling rose"] += qty;
                            MATERIALS["3/3 Junction box"] += qty;
                            MATERIALS["Gujja"] += qty;
                            MATERIALS["Fan box round Sheet"] += qty;
                            MATERIALS['1.5"kala patch'] += qty;
                            MATERIALS["6amp switch"] += qty;
                            MATERIALS["regulator"] += qty;
                            roomModule += qty * 2;
                        }

                        if (item === "Exhaust fan") {
                            MATERIALS["celling rose"] += qty;
                            MATERIALS["3/3 Junction box"] += qty;
                            MATERIALS["Gujja"] += qty;
                            MATERIALS['1.5"kala patch'] += qty;
                            MATERIALS["6amp switch"] += qty;
                            roomModule += qty * 1;
                        }

                        if (item === "Led bulb batten") {
                            MATERIALS["Led bulb"] += qty;
                            MATERIALS["batten holder"] += qty;
                            MATERIALS["3/3 Junction box"] += qty;
                            MATERIALS["Gujja"] += qty;
                            MATERIALS['1.5"kala patch'] += qty;
                            MATERIALS["6amp switch"] += qty;
                            roomModule += qty * 1;
                        }

                        // ================= 2WAY SWITCHES =================

                        // 2WAY F
                        if (item === "2way F") {

                            MATERIALS["4 module (board+plate)"] += qty;

                            MATERIALS["regulator"] += qty;

                            MATERIALS["Gujja"] += qty * 5;

                            MATERIALS['1.5"kala patch'] += qty * 5;

                            MATERIALS["0.4 mm washer"] += qty * 5;

                            MATERIALS["3/3 Junction box"] += qty;

                            MATERIALS["Fan"] += qty;

                            MATERIALS["celling rose"] += qty;

                        if (item === "Tv board") {

                            MATERIALS["16amp switch"] += qty;

                            MATERIALS['1.5"kala patch'] += qty * 4;
                            MATERIALS["3 module (board+plate)"] += qty;
                            // No roomModule +=
                        }

                        if (item === "AC") {
                            MATERIALS["32amp dp switch"] += qty;
                            MATERIALS["16amp Socket"] += qty;
                            MATERIALS["Gujja"] += qty * 4;
                            MATERIALS['1.5"kala patch'] += qty * 4;
                            MATERIALS["2 module (board+plate)"] += qty;
                            roomModule += qty * 2;   // AC still uses main board space
                        }

                        if (item === "Inverter") {
                            MATERIALS["16amp switch"] += qty * 2;

                            MATERIALS["6 module (board+plate)"] += qty;
                            // No roomModule +=
                        }

                        if (item === "Induction board") {
                            MATERIALS["16amp switch"] += qty * 2;
                            MATERIALS["16amp Socket"] += qty * 2;
                            MATERIALS["Gujja"] += qty * 4;
                            MATERIALS['1.5"kala patch'] += qty * 4;
                            MATERIALS["6 module (board+plate)"] += qty;
                            // No roomModule +=

                        if (item === "Fridge board") {

                            MATERIALS['1.5"kala patch'] += qty * 4;

                            MATERIALS["2 module (board+plate)"] += qty;
                            roomModule += qty * 2;   // Geyser still uses main board
                        }

                        if (item === "Patti") {
                            MATERIALS["Patti"] += qty;
                            MATERIALS["35/8 Screw"] += qty * 7;
                            MATERIALS["Gujja"] += qty * 7;
                            MATERIALS["0.4 mm washer"] += qty * 7;
                        }

                        // MCB Section
                        if (roomType === "MCB") {
                            if (item.includes("Isolater") || item.includes("Mcb Changer") || item.includes("RCCB")) {
                                MATERIALS[item] += qty;
                            }
                            if (["6amp mcb", "10amp mcb", "16amp mcb", "20amp mcb", "25amp mcb", "32amp mcb", "40amp mcb", "63amp mcb"].includes(item)) {

                        return; // BILL GENERATE STOP
                    }

                    // ================= FINAL MAIN ROOM PLATE =================
                    if (roomType !== "MCB" && roomModule > 0) {
                        const plateSize = getPlateSize(roomModule);

                        // Add Main Board + Plate
                        MATERIALS[`${plateSize} module (board+plate)`] += 1;

                        // Blankers for empty modules
                        const emptySpace = plateSize - roomModule;
                        if (emptySpace > 0) {
                            MATERIALS["blanker"] += emptySpace;
                        }

                        // Extra Fixing Hardware for each Main Plate
                        MATERIALS["0.4 mm washer"] += 4;
                        MATERIALS['1.5"kala patch'] += 4;
                        MATERIALS["Gujja"] += 4;
                    }
                });

                // Final Calculations
                MATERIALS["0.4 mm washer"] = MATERIALS["Gujja"];

                showBill(MATERIALS);

            // Helper Function

                if (moduleCount <= 1) return 1;
                if (moduleCount <= 2) return 2;
                if (moduleCount <= 3) return 3;

                if (moduleCount <= 6) return 6;
                if (moduleCount <= 8) return 8;
                if (moduleCount <= 12) return 12;
                if (moduleCount <= 16) return 16;
                return 18;

                else if (moduleCount <= 2) plateSize = 2;
                else if (moduleCount <= 3) plateSize = 3;
                else if (moduleCount <= 4) plateSize = 4;
                else if (moduleCount <= 6) plateSize = 6;
                else if (moduleCount <= 8) plateSize = 8;
                else if (moduleCount <= 12) plateSize = 12;
                else if (moduleCount <= 16) plateSize = 16;
                else plateSize = 18;

                MATERIALS[`${plateSize} module (board+plate)`] += 1;

                return plateSize;
            }

            // ================= PDF DOWNLOAD =================
               function downloadPDF() {

    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF('p', 'pt', 'a4');

    // ================= CUSTOMER DETAILS =================

    const customerName =
        document.getElementById('custName')?.value.trim() || "Customer";

    const address =
        document.getElementById('custAddress')?.value.trim() || "-";

    const phone =
        document.getElementById('phone')?.value.trim() || "-";

    const today = new Date();

    // ================= PAGE SIZE =================

    const pageWidth = pdf.internal.pageSize.width;
    const pageHeight = pdf.internal.pageSize.height;

    // ================= HEADER =================

    pdf.setFillColor(0, 102, 204);

    pdf.rect(0, 0, pageWidth, 90, "F");

    // ================= LOGO =================

    try {

        const logo = document.querySelector(".header-logo");

        if (logo) {

            pdf.addImage(
                logo,
                "PNG",
                30,
                15,
                55,
                55
            );
        }

    } catch (e) {
        console.log(e);
    }

    // ================= COMPANY NAME =================

    pdf.setTextColor(255, 255, 255);

    pdf.setFontSize(24);

    pdf.setFont(undefined, "bold");

    pdf.text("SM Technician", 105, 35);


    // ================= ELECTRICIAN NAME =================

pdf.setFontSize(12);

pdf.setFont(undefined, "normal");

pdf.text(
    "Electrician - Sonu and Manoj",
    105,
    55
);

// ================= MOBILE =================

pdf.text(
    "Mobile : 6202346561, 8935883863",
    105,
    72
);

    // ================= DATE =================

    pdf.text(
        `Date : ${today.toLocaleDateString('en-IN')}`,
        420,
        45
    );

    // ================= TITLE =================

    pdf.setTextColor(0);

    pdf.setFontSize(18);

    pdf.setFont(undefined, "bold");

    pdf.text(
        "Electrical Material Estimate",
        160,
        125
    );

    // ================= LINE =================

    pdf.setDrawColor(180);

    pdf.line(40, 135, 555, 135);

    // ================= CUSTOMER INFO =================

    pdf.setFontSize(12);

    // Customer

    pdf.setFont(undefined, "bold");

    pdf.text("Customer Name :", 40, 165);

    pdf.setFont(undefined, "normal");

    pdf.text(customerName, 170, 165);

    // Address

    pdf.setFont(undefined, "bold");

    pdf.text("Address :", 40, 190);

    pdf.setFont(undefined, "normal");

    pdf.text(address, 170, 190);

    // Mobile

    pdf.setFont(undefined, "bold");

    pdf.text("Mobile :", 40, 215);

    pdf.setFont(undefined, "normal");

    pdf.text(phone, 170, 215);

    // ================= TABLE DATA =================

    const rows = [];

    let serial = 1;

    const tableRows =
        document.querySelectorAll('#billModal table tr');

    tableRows.forEach((row) => {

        const cols = row.querySelectorAll('td');

        if (cols.length < 2) return;

        // ================= MATERIAL =================

        let material =
            cols[0].innerText.trim();

        const materialInput =
            cols[0].querySelector('input');

        if (
            materialInput &&
            materialInput.value.trim() !== ''
        ) {
            material = materialInput.value.trim();
        }

        // ================= QTY =================

        let qty = '';

        const qtyInput =
            cols[1].querySelector('input');

        if (qtyInput) {

            qty = qtyInput.value;

        } else {

            qty = cols[1].innerText.trim();
        }

        // ================= UNIT =================

        let unit = "Pic";

        if (cols[2]) {
            unit = cols[2].innerText.trim();
        }

        // ================= WIRE COLOUR =================

        let wireColor = "";

        const colorSelect =
            row.querySelector(".wire-color");

        if (
            colorSelect &&
            colorSelect.value
        ) {

            wireColor =
                " (" + colorSelect.value + ")";
        }

        // ================= PUSH DATA =================

        if (
            material &&
            parseInt(qty) > 0 &&
            material !== "Extra Materials"
        ) {

            rows.push([

                serial++,

                material + wireColor,

                qty,

                unit
            ]);
        }

    });

    // ================= TABLE =================

    pdf.autoTable({

        startY: 245,

        head: [[
            'S.No',
            'Material Name',
            'Qty',
            'Unit'
        ]],

        body: rows,

        theme: 'grid',

        styles: {

            fontSize: 11,

            cellPadding: 6,

            valign: 'middle'
        },

        headStyles: {

            fillColor: [0, 102, 204],

            textColor: 255,

            fontStyle: 'bold',

            halign: 'center'
        },

        alternateRowStyles: {

            fillColor: [245, 245, 245]
        },

        columnStyles: {

            0: {
                cellWidth: 45,
                halign: 'center'
            },

            1: {
                cellWidth: 300
            },

            2: {
                cellWidth: 70,
                halign: 'center'
            },

            3: {
                cellWidth: 70,
                halign: 'center'
            }
        },

        didDrawPage: function (data) {

            // ================= FOOTER =================

            pdf.setFontSize(10);

            pdf.setTextColor(120);

            pdf.text(
                "SM Technician • 8935883863",
                40,
                pageHeight - 30
            );

            pdf.text(
                "Thank you for choosing SM Technician",
                40,
                pageHeight - 15
            );

            // ================= PAGE NUMBER =================

            const pageNumber =
                pdf.internal.getNumberOfPages();

            pdf.text(
                `Page ${pageNumber}`,
                pageWidth - 80,
                pageHeight - 20
            );
        }

    });

    // ================= SAVE PDF =================

    const fileName =
        `${customerName}_Estimate.pdf`;

    pdf.save(fileName);
}

                    roomCard.querySelector(".dynamic-room-fields");

            document.addEventListener("focusin", function (e) {

                if (
                    e.target.tagName === "INPUT" &&
                    e.target.type === "number"
                ) {

                    if (e.target.value === "0") {
                        e.target.value = "";
                    }

                }

            });

            document.addEventListener("focusout", function (e) {

                if (
                    e.target.tagName === "INPUT" &&
                    e.target.type === "number"
                ) {

                    if (e.target.value.trim() === "") {
                        e.target.value = "0";
                    }

                }

            });

            function showModuleAlert(roomName, moduleCount) {

                const oldAlert = document.querySelector(".module-alert");

                if (oldAlert) {
                    oldAlert.remove();
                }

                const alertBox = document.createElement("div");

                alertBox.className = "module-alert";

                alertBox.innerHTML = `
        ⚠️ <span>${roomName}</span><br>
        Module Count: ${moduleCount}<br><br>
        18 se zyada module allowed nahi hai.
    `;

                document.body.appendChild(alertBox);

                setTimeout(() => {
                    alertBox.remove();
                }, 5000);
            }






            // ================= SHARE ON WHATSAPP =================
            function shareOnWhatsApp() {
                const customerName = document.getElementById('custName').value.trim() || "Customer";
                const phone = document.getElementById('phone').value.trim();

                if (!phone) {
                    alert("Please enter Customer Mobile Number!");
                    return;
                }

                // Clean Phone Number
                let cleanPhone = phone.replace(/[^0-9]/g, '');
                if (cleanPhone.length === 10) {
                    cleanPhone = '91' + cleanPhone;
                }

                const message = encodeURIComponent(
                    `Hello ${customerName},\n\n` +
                    `Please find attached your Electrical Material Estimate.\n\n` +
                    `SM Technician\n` +
                    `8935883863\n\n` +
                    `Thank you! 🙏`
                );

                // First Download PDF
                downloadPDF();

                // Then open WhatsApp with message
                setTimeout(() => {
                    const whatsappURL = `https://wa.me/${cleanPhone}?text=${message}`;
                    window.open(whatsappURL, '_blank');

                    alert("✅ PDF Downloaded!\n\nNow you can attach the downloaded PDF in WhatsApp.");
                }, 800);
            }


            function updateApproxPrice() {

                let total = 0;

                // MAIN MATERIAL TABLE
                document.querySelectorAll('#billModal table tr').forEach(row => {

                    const cols = row.querySelectorAll('td');

                    if (cols.length < 3) return;

                    let item = cols[0].innerText.trim();

                    const qtyInput = cols[1].querySelector('input');

                    if (!qtyInput) return;

                    const qty = parseFloat(qtyInput.value) || 0;

                    const price = PRICE_LIST[item] || 0;

                    total += qty * price;

                });



                // EXTRA MATERIAL SECTION
                document.querySelectorAll('.extra-material-row').forEach(row => {

                    const itemInput = row.querySelector('.extra-name');
                    const qtyInput = row.querySelector('.extra-qty');
                    const priceInput = row.querySelector('.extra-price');

                    if (!itemInput || !qtyInput || !priceInput) return;

                    const qty = parseFloat(qtyInput.value) || 0;

                    let price = parseFloat(priceInput.value);

                    // agar manual price nahi diya to PRICE_LIST se uthao
                    if (isNaN(price)) {

                        const itemName = itemInput.value.trim();

                        price = PRICE_LIST[itemName] || 0;
                    }

                    total += qty * price;

                });



                // WIRE SECTION
                document.querySelectorAll('.wire-row').forEach(row => {

                    const wireName = row.querySelector('.wire-name');

                    const qtyInput = row.querySelector('.wire-qty');

                    if (!wireName || !qtyInput) return;

                    const qty = parseFloat(qtyInput.value) || 0;

                    const price = PRICE_LIST[wireName.value] || 0;

                    total += qty * price;

                });



                // SHOW TOTAL
                const totalBox = document.getElementById('approxTotalPrice');

                if (totalBox) {

                    totalBox.innerText =
                        "₹ " + total.toLocaleString('en-IN');
                }
            }


        </script>
